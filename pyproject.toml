[project]
name = "selfhost-remote-mail-mcp"
version = "0.19.2"
description = "Your own email in Claude, ChatGPT, Codex and other AI apps, on computer and phone. Self-hosted IMAP/SMTP MCP server."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "imapclient>=3.0",
    "markdown>=3.5",
    "pypdf>=5.0",
    "cryptography>=44",
    "keyring>=25",
    "dnspython>=2.6",
    "pillow>=11",
    "pillow-heif>=0.20",
]
keywords = ["mcp", "email", "imap", "smtp", "claude", "self-hosted"]

[project.optional-dependencies]
addons = [   # Python packages some library add-ons need (each add-on's README says which)
    "fpdf2>=2.8.3",   # pdf_maker, invoices
    "tzdata",         # invoices: time zones on systems without them (Windows, slim images)
    "caldav>=3.4,<4", # caldav (calendar)
]

[project.scripts]
selfhost-remote-mail-mcp = "selfhost_remote_mail_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Self-hosted-MCP/Selfhost-Remote-Mail-MCP"

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "selfhost_remote_mail_mcp/CHANGELOG.md"   # shown on the settings page

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
