# Publishes the ready-made Docker image to ghcr.io/self-hosted-mcp/selfhost-remote-mail-mcp for each release,
# for both amd64 and arm64 servers. Tags: the version (0.18.1), major.minor (0.18) and latest.
# Only official releases are built, never unreleased code. Runs only in the original project, not in forks.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, like v0.18.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'Self-hosted-MCP/Selfhost-Remote-Mail-MCP'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0, pinned
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1, pinned
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0, pinned
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0, pinned
        with:
          images: ghcr.io/self-hosted-mcp/selfhost-remote-mail-mcp
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Selfhost-Remote-Mail-MCP
            org.opencontainers.image.description=Your own email inside Claude, ChatGPT, Codex and other AI apps. Self-hosted IMAP/SMTP MCP server.
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0, pinned
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
