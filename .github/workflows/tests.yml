# Runs every test on each push and pull request, on the oldest and newest supported Python.
# The tests use a fake mail server: no real mailbox, password or network service is touched.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.0, pinned
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra addons
      - name: Lint (ruff)
        run: uvx --from ruff==0.17.2 ruff check .
      - run: uv run pytest -q
      - name: Shell scripts are valid
        run: bash -n scripts/update.sh

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      # Unsafe patterns in GitHub Actions: leaked tokens, injection, broad permissions.
      - run: pipx run zizmor==1.31.1 --offline .
