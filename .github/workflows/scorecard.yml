name: scorecard

# OpenSSF Scorecard: an outside check of this repository's security practices
# (pinned actions, token permissions, branch protection, signed releases, ...).
# Results are public at https://scorecard.dev. Runs in the original project, not in forks.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    if: github.repository == 'Self-hosted-MCP/Selfhost-Remote-Mail-MCP'
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0, pinned
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1, pinned
        with:
          sarif_file: results.sarif
